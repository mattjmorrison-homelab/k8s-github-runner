# gha-runner-scale-set-controller — cluster-wide, one release, manages the
# RunnerScaleSet CRDs that the two runner releases (values-runner-amd64.yaml,
# values-runner-arm64.yaml) create.

# Metrics are disabled by the chart's own defaults (controller-manager and
# listener addrs both default to "0"/empty) -- enabled here so Prometheus
# can scrape reconcile-error counts. This is what would have caught the
# stuck EphemeralRunner silently failing tonight instead of needing a
# manual kubectl logs dig.
metrics:
  controllerManagerAddr: ":8080"
  listenerAddr: ":8080"
  listenerEndpoint: "/metrics"
