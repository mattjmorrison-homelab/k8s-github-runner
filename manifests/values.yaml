# Bump this to any new string to force the k8s-amd64-runner pods to
# restart on the next sync. Same convention as k8s-zot's restartTrigger:
# a plain kubectl restart isn't used here -- every change to what's
# running in the cluster goes through a git commit ArgoCD syncs, never
# a direct cluster command.
restartTrigger: "2026-11-10-recover-stuck-amd64-runners"
