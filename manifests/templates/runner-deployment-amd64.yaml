apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-amd64-runner
  namespace: github-runner
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k8s-amd64-runner
  template:
    metadata:
      labels:
        app: k8s-amd64-runner
      annotations:
        restart-trigger: {{ .Values.restartTrigger | quote }}
    spec:
      serviceAccountName: github-runner-workload
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
          env:
            - name: ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT
              value: "1"
            - name: RUNNER_LABEL
              value: k8s-amd64
            - name: DISABLE_RUNNER_UPDATE
              value: "true"
          command: ["/bin/bash", "/scripts/run.sh"]
          volumeMounts:
            - name: register-script
              mountPath: /scripts
            - name: github-app-creds
              mountPath: /creds
              readOnly: true
      volumes:
        - name: register-script
          configMap:
            name: runner-register-and-run
            defaultMode: 0755
        - name: github-app-creds
          secret:
            secretName: github-runner-app-credentials
